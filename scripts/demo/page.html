<!doctype html>
<html lang="<!-- LANG -->">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dayflow panel · demo</title>
    <style>
      /* HARNESS_TOKENS */
    </style>
    <style>
      /* PRIMITIVE_CSS */
    </style>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--dsw-alias-bg-base);
        color: var(--dsw-alias-label-primary);
        font-family: var(--dsw-font-family);
        -webkit-font-smoothing: antialiased;
      }

      /* The harness shell frame: a page tab with a title row, an optional
         toolbar, and the pane below it. */
      .demo-root {
        box-sizing: border-box;
        width: 100vw;
        height: 100vh;
        padding: 22px 24px 0;
        display: flex;
        flex-direction: column;
      }

      .demo-tabs {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 2px 14px;
      }

      .demo-tab {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 10px 0 12px;
        border-radius: var(--dsw-radius-sm);
        background: var(--dsw-alias-button-ghost-active-fill);
        color: var(--dsw-alias-label-primary);
        font-size: 13px;
        line-height: 20px;
        font-weight: 500;
      }

      .demo-tab-close {
        display: inline-flex;
        width: 16px;
        height: 16px;
        align-items: center;
        justify-content: center;
        color: var(--dsw-alias-label-tertiary);
      }

      .demo-tab-add {
        display: inline-flex;
        width: 20px;
        height: 20px;
        align-items: center;
        justify-content: center;
        color: var(--dsw-alias-label-tertiary);
      }

      .demo-pane {
        flex: 1;
        min-height: 0;
        border: 1px solid var(--dsw-alias-border-l2);
        border-bottom: 0;
        border-radius: var(--dsw-radius-lg) var(--dsw-radius-lg) 0 0;
        background: var(--dsw-alias-bg-layer-1);
        box-shadow: var(--dsw-elevation-soft);
        overflow: hidden;
      }

      #panel {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="demo-root">
      <div class="demo-tabs">
        <span class="demo-tab">
          <span>Dayflow</span>
          <span class="demo-tab-close">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
            </svg>
          </span>
        </span>
        <span class="demo-tab-add">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M7 2.5v9M2.5 7h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        </span>
      </div>
      <div class="demo-pane"><div id="panel"></div></div>
    </div>
    <script>
      /* REPLAY */
    </script>
    <script>
      /* BUNDLE */
    </script>
  </body>
</html>
