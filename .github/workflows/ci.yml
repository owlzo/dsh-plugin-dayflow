name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # macOS is required: the preference-reading tests exercise `defaults`.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 24
          # node:sqlite exists on 22 but needs the flag until Node 23.4.
          - node: 22
            node-options: --experimental-sqlite
    env:
      NODE_OPTIONS: ${{ matrix.node-options }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the package contents
        run: npm pack --dry-run
